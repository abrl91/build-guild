[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buildguild-llm-judge-calibration"
version = "0.1.0"
description = "BuildGuild Quest 4: LLM as a Judge Calibration"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.36",
  "datasets>=2.19",
  "dspy>=2.6",
  "openai>=1.0",
  "rouge-score>=0.1.2",
  "sentence-transformers>=3.0",
]

[tool.uv]
managed = true
